name: Build ECO Delivery Partner Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signing
          if [ -f signing/eco-upload.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in signing/eco-upload.jks.enc -out app/eco-upload.jks -pass env:KEYSTORE_PASSWORD
          else
            keytool -genkeypair -v \
              -keystore app/eco-upload.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias eco-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ECO Delivery Partner, OU=Android, O=ECO Grocery, L=Patna, ST=Bihar, C=IN"
            openssl enc -aes-256-cbc -salt -pbkdf2 \
              -in app/eco-upload.jks \
              -out signing/eco-upload.jks.enc \
              -pass env:KEYSTORE_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/eco-upload.jks.enc
            git commit -m "Add encrypted Android upload signing key"
            git push
          fi

      - name: Build signed Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ECO-Delivery-Partner-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
