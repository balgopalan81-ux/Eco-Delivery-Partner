
name: Build ECO Grocery Delivery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Wrapper
        id: locate
        run: |
          WRAPPER=$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          chmod +x "$WRAPPER"
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECO-Grocery-Delivery-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
