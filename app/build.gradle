plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ecogrocery.delivery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ecogrocery.delivery'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('eco-upload.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'eco-upload'
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
